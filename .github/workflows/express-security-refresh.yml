name: One-off Express security lockfile refresh
on:
  push:
    branches:
      - security/validate-mongoose-write-inputs
    paths:
      - .github/workflows/express-security-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/sigru_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/validate-mongoose-write-inputs
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh lockfile
        working-directory: apps/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install resolved dependencies
        working-directory: apps/api
        run: npm ci --no-audit --no-fund
      - name: Run unit and HTTP tests
        working-directory: apps/api
        run: npm test
      - name: Run MongoDB integration tests
        working-directory: apps/api
        run: npm run test:db
      - name: Audit production dependencies
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high
      - name: Commit validated lockfile
        run: |
          if git diff --quiet -- apps/api/package-lock.json; then
            echo "Lockfile already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package-lock.json
          git commit -m "chore(security): refresh Express dependency lockfile"
          git push origin HEAD:security/validate-mongoose-write-inputs
