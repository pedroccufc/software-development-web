name: SIGRU backend checks

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/sigru-backend.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/sigru-backend.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit and HTTP integration tests
        run: npm test
