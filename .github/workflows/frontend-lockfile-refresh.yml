name: One-off frontend dependency migration lockfile
on:
  push:
    branches:
      - security/audit-sigru-frontend
    paths:
      - .github/workflows/frontend-lockfile-refresh.yml
      - apps/web/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/audit-sigru-frontend
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve dependency versions
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from new lockfile
        run: npm ci --no-audit --no-fund
      - name: Build frontend with Vite
        run: npm run build
      - name: Audit all frontend dependencies (high or critical)
        run: npm audit --audit-level=high
      - name: Save validated dependency lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+pedroccufc@users.noreply.github.com"
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(security): regenerate Vite frontend lockfile"
          git push origin HEAD:security/audit-sigru-frontend
