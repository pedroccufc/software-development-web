name: Refresh backend security lockfile
on:
  push:
    branches:
      - security/validate-mongoose-write-inputs
    paths:
      - apps/api/package.json
      - .github/workflows/security-lockfile-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/validate-mongoose-write-inputs
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh npm lockfile
        working-directory: apps/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify install from new lockfile
        working-directory: apps/api
        run: npm ci --no-audit --no-fund
      - name: Run existing tests
        working-directory: apps/api
        run: npm test
      - name: Commit generated lockfile to PR branch
        run: |
          if git diff --quiet -- apps/api/package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package-lock.json
          git commit -m "chore(security): sync Mongoose 8 npm lockfile"
          git push origin HEAD:security/validate-mongoose-write-inputs
